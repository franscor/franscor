[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franscor"
version = "0.2.0"
description = "FRANSCOR — secure interoperability layer for AI agents (identity, discovery, delegation, signed evidence)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Lamstra Labs" }]
keywords = ["ai", "agents", "multi-agent", "interoperability", "protocol", "ed25519", "langchain", "mcp", "a2a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "websockets>=13",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
otel = ["opentelemetry-api>=1.20"]
mcp = ["mcp>=2.3"]
a2a = ["a2a-sdk>=1.3", "httpx>=0.27", "starlette>=0.40", "uvicorn>=0.30"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "opentelemetry-sdk>=1.20", "keyring>=24", "jsonschema>=4", "mcp>=2.3", "a2a-sdk>=1.3", "httpx>=0.27", "starlette>=0.40", "openai-agents>=0.24", "autogen-core>=0.7", "langchain-core>=1.0", "langgraph>=1.0"]

[project.scripts]
franscor = "franscor.cli:main"

[project.urls]
Homepage = "https://franscor.com"
Documentation = "https://franscor.com/sdk"

[tool.setuptools.packages.find]
include = ["franscor*"]

[tool.setuptools.package-data]
franscor = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
